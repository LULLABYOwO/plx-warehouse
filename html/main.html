<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLX Warehouse Dashboard</title>
  <link rel="stylesheet" href="../assets/fonts.css">
  <link rel="stylesheet" href="../assets/main.css">
</head>
<body>
  <div class="dashboard-shell">
    <header class="dashboard-header">
      <div>
        <h1>Inventory Dashboard</h1>
        <p>Welcome, <strong id="user-name"></strong> (<span id="user-privilege"></span>)</p>
      </div>
      <button id="logout-btn" class="primary-btn">Logout</button>
    </header>

    <section class="section-card">
      <h2>Inventory</h2>
      <div class="table-wrapper">
        <table id="inventory-table">
          <thead>
            <tr>
              <th>Số thẻ</th>
              <th>Tên</th>
              <th>Số seri</th>
              <th>Loại</th>
              <th>Ngày sử dụng</th>
              <th>Bên sử dụng</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="priv-view-only" class="section-card hidden">
      <h2>Chế độ xem</h2>
      <p>Bạn chỉ có quyền xem dữ liệu. Nếu muốn chỉnh sửa, cần tài khoản có quyền Editor.</p>
    </section>

    <div id="admin-panel" class="hidden">
      <section class="section-card">
        <h2>Quản lý người dùng</h2>
        <div id="user-management-list" class="list-grid"></div>
      </section>

      <section class="section-card">
        <h2>Quản lý loại tài sản</h2>
        <div id="type-management-list" class="list-grid"></div>
      </section>

      <section class="section-card">
        <h2>Quản lý chủ sở hữu</h2>
        <div class="owner-add-form">
          <input id="new-owner-name" type="text" placeholder="New owner name" />
          <button id="owner-add-btn" class="secondary-btn">Add Owner</button>
        </div>
        <div id="owner-management-list" class="list-grid"></div>
      </section>
    </div>
  </div>

  <script type="module" src="../scripts/firebase-config.js"></script>
  <script type="module" src="../scripts/dashboard.js"></script>
</body>
</html>
