<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLX Warehouse Login</title>
  <link rel="icon" type="image/png" sizes="256x256" href="assets/icons/Cat 256x256.ico">
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="assets/main.css">
</head>
<body>
  <div class="container">
    <div class="auth-card">
      <h1>Warehouse Login</h1>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>
      <button id="login-btn" class="primary-btn">Login</button>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <script>
    // Clear entire localStorage each time index.html is opened
    try {
      localStorage.clear();
    } catch (e) {
      console.warn('localStorage.clear() failed', e);
    }
  </script>
  <script type="module" src="scripts/login.js"></script>
</body>
</html>
